
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="./CSS/styles.css"/>
</head>
<body>
    <main class="main">
        <section class="container">
            <img src="./images/illustration-hero.svg" alt="Hero Image" class="hero-image"/>
            <div class="card-content">
                <h1 class="heading">Order Summary</h1>
                <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
                <div class="plan">
                    <img src="./images/icon-music.svg" alt="Music Icon"/>
                    <div class="plan-text">
                        <h2>Annual Plan</h2>
                        <p>$59.99/year</p>
                        <a href="#" class="change-link">Change</a>
                    </div>
                </div>
                <button class="proceed-btn">Proceed to Payment</button>
                <a href="#" class="cancel-order">Cancel Order</a>
            </div>
        </section>
    </main>
    <footer class="attribution">
        Challenge by <a href="https://www.crio.do" target="_blank">Crio.Do</a>. Coded by <a href="https://www.github.com/BVenkataSravanKumar" target="_blank">
    B Venkata Sravan Kumar
</a>
    </footer>
</body>
</html>
